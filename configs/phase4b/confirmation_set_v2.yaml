# Phase 4b confirmation query set v2 (approved corrected Option A, 2026-10-02).
# Replaces the rejected v1 (configs/phase4b/confirmation_set_v1_REJECTED.yaml).
# Created after the routers were frozen
# (results/phase4b_train_311634ee3011_20261002T145649Z); used once.
#
# Procedure (fixed BEFORE drawing):
#  1. Eligible population = rows of sift_learn in ascending row order, EXCLUDING
#     every row whose vector is a byte-exact copy of any of the 10,000 original
#     SIFT queries, and keeping each distinct remaining vector once (its lowest
#     sift_learn row), so the sample cannot contain internal exact duplicates.
#  2. Fisher-Yates over population POSITIONS 0..N-1 with std::mt19937_64(seed)
#     and rejection-sampled bounded integers (ars::MakeQuerySplit, as for the
#     train/test split); the first 2,000 positions are selected; output in
#     ascending sift_learn row order.
#  The seed is applied to the FILTERED population. Seed 20261007 is new (never
#  used before; 20261005 = rejected v1, 20261006 = B1 hash).
experiment_name: phase4b_confirmation_set_v2
source: data/sift/sift_learn.fvecs
exclude_exact_duplicates_of: [data/sift/sift_query.fvecs]
deduplicate_population: true
n_select: 2000
seed: 20261007
query_set_id: sift_learn_confirm_v2_seed20261007
output_fvecs: data/confirm/sift_learn_confirm_v2_seed20261007_n2000.fvecs
output_ids: splits/confirmation_v2_sift_learn_seed20261007_n2000_ids.csv
output_tagging: splits/confirmation_v2_sift_learn_seed20261007_n2000_tagging.csv
output_dir: results
