# Confirmation query set v2, drawn once after the routers were frozen. It drops
# exact copies of the original SIFT queries and keeps each distinct vector once.
# Never regenerate it with different settings.
experiment_name: phase4b_confirmation_set_v2
source: data/sift/sift_learn.fvecs
exclude_exact_duplicates_of: [data/sift/sift_query.fvecs]
deduplicate_population: true
n_select: 2000
seed: 20261007
query_set_id: sift_learn_confirm_v2_seed20261007
output_fvecs: data/confirm/sift_learn_confirm_v2_seed20261007_n2000.fvecs
output_ids: splits/confirmation_v2_sift_learn_seed20261007_n2000_ids.csv
output_tagging: splits/confirmation_v2_sift_learn_seed20261007_n2000_tagging.csv
output_dir: results
