    seeds:
      42: {oracle_run: results/8e605bfc5769_20261001T201040Z, features_run: results/657980fb7c23_20261002T144828Z}
      43: {oracle_run: results/e795d8b6d6df_20261002T133032Z, features_run: results/94945b3661cb_20261002T144831Z}
      44: {oracle_run: results/3e2faa1921f8_20261002T133032Z, features_run: results/1c816578a946_20261002T144834Z}
  confirmation:           # PRIMARY; runs filled in after the set is created
    query_set_id: sift_learn_confirm_v2_seed20261007   # frozen v2 set (v1 rejected)
    split_value: test     # all rows of the confirmation set are tagged "test"
    seeds:                # confirmation v2 runs (2026-10-02)
      42: {oracle_run: results/6cc721cd28dc_20261002T173819Z, features_run: results/152d65619a3d_20261002T174455Z}
      43: {oracle_run: results/c4eb66527ca2_20261002T174027Z, features_run: results/0424aedbaf85_20261002T174457Z}
      44: {oracle_run: results/dc50f5d75ebc_20261002T174241Z, features_run: results/09a4fe4d7f3a_20261002T174459Z}
  old_test_second_look:   # SECONDARY / DISCLOSED SECOND LOOK (after primary)
    query_set_id: sift_query
    split_value: test
    seeds:
      42: {oracle_run: results/8e605bfc5769_20261001T201040Z, features_run: results/657980fb7c23_20261002T144828Z}
      43: {oracle_run: results/e795d8b6d6df_20261002T133032Z, features_run: results/94945b3661cb_20261002T144831Z}
      44: {oracle_run: results/3e2faa1921f8_20261002T133032Z, features_run: results/1c816578a946_20261002T144834Z}

statistics:
  bootstrap_resamples: 2000
  bootstrap_seed: 20261002
  bootstrap: query-clustered (resample query ids; all seeds of a query together)
  wilcoxon: per-query seed-averaged paired cost differences (router - B1)
  mcnemar: exact, per seed

gate:                     # frozen (bias audit §10)
  min_saving: 0.10
  alpha: 0.01
  quality_margin: -0.01
  calibration_flag_tolerance: 0.02   # symmetric report only (both below S* - 0.02 -> shift flag)

difficulty: {easy_max: 18, medium_max: 48}   # easy <= 18 < medium <= 48 < hard (frozen Phase 3)

output_dir: results
