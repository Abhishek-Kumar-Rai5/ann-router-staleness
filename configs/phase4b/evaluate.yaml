# Phase 4b final evaluation of the FROZEN routers (frozen statistical plan:
# docs/phase4_bias_audit.md §10). No fitting or selection happens here.
experiment_name: phase4b_final_evaluation
train_run: results/phase4b_train_311634ee3011_20261002T145649Z

eval_sets:
  dry_run_train:          # code check only (in-sample); never reported as a result
    query_set_id: sift_query
