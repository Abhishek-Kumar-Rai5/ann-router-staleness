# Quick end-to-end check of the Phase 1 pipeline on a SIFT subsample (under a
# minute). Run it after every code change.
experiment_name: smoke_sift_static

dataset:
  base: data/sift/sift_base.fvecs
  queries: data/sift/sift_query.fvecs
  max_base: 20000
  max_queries: 200

index:
  m: 16
  ef_construction: 200
  seed: 42
  build_threads: 1  # single-threaded so the graph is reproducible

ground_truth:
  k: 100

search:
  k: 10
  ef_values: [10, 20, 40, 80, 160, 320]
  timing_repeats: 3
  warmup_queries: 20

paths:
  cache_dir: data/cache
  output_dir: results
