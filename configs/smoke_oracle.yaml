# Quick check of the Phase 2 oracle pipeline on a SIFT subsample (under a minute).
experiment_name: smoke_oracle_sift

dataset:
  base: data/sift/sift_base.fvecs
  queries: data/sift/sift_query.fvecs
  max_base: 20000
  max_queries: 200

index:
  m: 16
  ef_construction: 200
  seed: 42
  build_threads: 1

ground_truth:
  k: 100

paths:
  cache_dir: data/cache
  output_dir: results

split:
  seed: 20261001  # the project's fixed split seed; never change it
  test_size: 40
  path: data/cache/smoke_split_200_seed20261001.csv

oracle:
  k: 10
  target_recall: 0.95
  recall_definition: tie_aware
  ef_grid:
    min: 10
    max: 1024
    ratio: 1.05
  search_threads: 16
