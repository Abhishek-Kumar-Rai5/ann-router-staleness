# Quick check of Phase 3 feature extraction on a SIFT subsample (under a minute).
experiment_name: smoke_features_sift

dataset:
  base: data/sift/sift_base.fvecs
  queries: data/sift/sift_query.fvecs
  max_base: 20000
  max_queries: 200

index:
  m: 16
  ef_construction: 200
  seed: 42
  build_threads: 1

ground_truth:
  k: 100

paths:
  cache_dir: data/cache
  output_dir: results

split:
  path: data/cache/smoke_split_200_seed20261001.csv

features:
  probe_k: 10
  probe_ef: 10
  lid_k: 20
  lid_ef: 20
  threads: 16
