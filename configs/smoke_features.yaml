# Smoke test for Phase 3 feature extraction on a SIFT subsample (< 1 min).
# §9, §21). dataset/index/ground_truth/paths are identical to Phases 1-2, so
# the cached S0 index is reused. No ground truth or oracle label is read.
experiment_name: smoke_features_sift

dataset:
  base: data/sift/sift_base.fvecs
  queries: data/sift/sift_query.fvecs
  max_base: 20000
  max_queries: 200

index:
  m: 16
  ef_construction: 200
  seed: 42
  build_threads: 1

ground_truth:
  k: 100

paths:
  cache_dir: data/cache
  output_dir: results

split:
  path: data/cache/smoke_split_200_seed20261001.csv

features:
  # Core probe: the cheapest search hnswlib allows at k=10 (it uses
  # max(ef, k), so ef < 10 is identical to ef = 10). Fixed by design, not tuned.
  probe_k: 10
  probe_ef: 10
  # LID ablation (§9: "second-tier, more expensive"): a separate, deeper probe.
  lid_k: 20
  lid_ef: 20
  threads: 16
