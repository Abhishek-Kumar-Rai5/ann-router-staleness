# Phase 5'(b) real-data state production (design_doc.md Addendum A1.4, with the
# 8% OOD decision of 2026-10-02). Pre-declared in docs/notes.md. Every value is
# the A1.4 / A1.11 value; do not edit after any evolved-state result exists.
experiment_name: phase5_sift1m
data:
  kind: sift
  base: data/sift/sift_base.fvecs
  queries: data/sift/sift_query.fvecs
  learn: data/sift/sift_learn.fvecs
  confirm_ids: splits/confirmation_v2_sift_learn_seed20261007_n2000_ids.csv
  pool: data/phase5/sift/pool.fvecs                 # built by phase5b_run.py (A1.4 item 1)
  pool_rows: data/phase5/sift/pool_rows.csv
  expected_pool_size: 87788
  split_path: splits/sift1m_query_split_seed20261001.csv
  split_seed: 20261001
  split_test_size: 2000
index: {m: 16, ef_construction: 200, seeds: [42, 43, 44]}
counts_fraction: [0.01, 0.02, 0.04, 0.08]     # of |S0| (insertion, ID and OOD)
delete_fraction: [0.02, 0.08]                  # of |S0| (lazy deletion)
seeds: {id_order: 20261008, deletion: 20261009, ood_anchor: 20261010}
oracle: {k: 10, gt_k: 100, target_recall: 0.95, ef_grid: {min: 10, max: 4096, ratio: 1.05}, threads: 16}
features: {probe_k: 10, probe_ef: 10, lid_k: 20, lid_ef: 20, threads: 16}
# Canonical S0 runs (read-only): seed 42 = Phase 2 / Phase 3; 43, 44 = Phase 4b.
s0_canonical:
  42: {oracle: results/8e605bfc5769_20261001T201040Z, features: results/657980fb7c23_20261002T050617Z}
  43: {oracle: results/e795d8b6d6df_20261002T133032Z, features: results/94945b3661cb_20261002T140528Z}
  44: {oracle: results/3e2faa1921f8_20261002T133032Z, features: results/1c816578a946_20261002T140458Z}
# V10 oracle reproducibility re-runs (pre-declared).
oracle_repro: [[42, id_80000], [43, ood_80000], [44, del_80000]]
state_root: data/phase5/sift/states
repro_root: data/phase5/sift/states_repro
